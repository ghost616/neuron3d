<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N3D 二期拓扑三维视图</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #04060d; color: #dbe4f5;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; overflow: hidden; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #view:active { cursor: grabbing; }
  .panel { position: absolute; background: rgba(12, 18, 34, 0.86); border: 1px solid rgba(120, 160, 240, 0.28);
    border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.65;
    backdrop-filter: blur(3px); }
  #toolbar { top: 12px; left: 12px; min-width: 260px; }
  #toolbar h1 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: #9fc0ff; }
  #toolbar label { display: inline-block; margin-right: 10px; cursor: pointer; user-select: none; }
  #toolbar input[type=checkbox] { vertical-align: -1px; margin-right: 4px; }
  #threshold { width: 100%; margin: 6px 0 2px; }
  #keep-count { color: #8fd3ff; }
  #btn-reset { margin-top: 6px; background: #1a2645; color: #cfe0ff; border: 1px solid #3a5183;
    border-radius: 5px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  #btn-reset:hover { background: #24345c; }
  #stats { top: 12px; right: 12px; white-space: pre; font-family: Consolas, monospace; font-size: 11.5px; }
  #legend-box { bottom: 12px; left: 12px; max-width: 62vw; }
  #legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin: 0 3px 0 8px; vertical-align: -1px; }
  #legend .sw:first-child { margin-left: 0; }
  #hover-label { position: absolute; display: none; pointer-events: none; z-index: 9;
    background: rgba(8, 14, 28, 0.94); border: 1px solid #4d7bd6; border-radius: 6px;
    padding: 6px 9px; font-size: 12px; line-height: 1.6; white-space: nowrap; }
  #hint { bottom: 12px; right: 12px; font-size: 11px; color: #7f93b8; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="toolbar" class="panel">
  <h1>N3D 二期拓扑三维视图</h1>
  <label><input type="checkbox" id="cb-neurons" checked>神经元</label>
  <label><input type="checkbox" id="cb-edges" checked>连接</label>
  <label><input type="checkbox" id="cb-planes">层平面</label>
  <div>边权重阈值 |w| &gt;= <span id="threshold-label">0.30</span></div>
  <input type="range" id="threshold" min="0" max="0.9" step="0.01" value="0.30">
  <div id="keep-count">保留 0 / 0 条边</div>
  <button id="btn-reset" type="button">重置视角</button>
</div>

<div id="stats" class="panel"></div>
<div id="legend-box" class="panel"><div id="legend"></div></div>
<div id="hover-label"></div>
<div id="hint" class="panel">左键拖拽旋转 · 滚轮缩放 · 右键拖拽平移 · 悬停查看神经元</div>

<script>
window.N3D_DATA = /*__N3D_DATA_JSON__*/;
</script>
<script>
/*__N3D_VIEWER_JS__*/
</script>
</body>
</html>
