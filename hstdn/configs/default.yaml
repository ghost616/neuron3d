# =============================================================================
# hstdn/configs/default.yaml —— H-STDN v3.2-final 设计文档 §4 超参唯一契约
#
# 契约（G1 前冻结）：本文件为全部实验超参的唯一来源（exp 模块维护），
# 禁止在 kernel/plasticity/gates 中散落魔法数字。core 就绪后本文件升格为
# core.layout.NetConfig 的唯一来源；在 core 尚未读取 yaml 的过渡期，由
# hstdn.configs.to_core_cfg() 将 network/lif/stdp/homeo 四节映射为 NetConfig。
#
# 命名沿用设计文档 §4 记号（tau_mem/radius_in/velocity/...），非 core 扁平
# 字段名；节内键名拼写错误会由加载器显式报错（防漂移）。
# =============================================================================

# ---- 网络规模与布线（network）------------------------------------------------
network:
  n_in: 100          # 输入神经元数（G1 合成首跑规模；MNIST D14 池化 10x10=100）
  n_pool: 800        # 储备池神经元数（≈千神经元规模，G0 #11 性能基准）
  e_ratio: 0.8       # E/I 比例 80/20（D11）
  extent: [1.0, 1.0, 0.3]   # 域范围 [x, y, z]：x/y 单位平面，池 z∈[0,0.3] 平板（D13）
  radius_in: 0.4     # 输入→池查询半径 R_IN（3-D）
  radius_pool: 0.18  # 池→池查询半径 R_POOL（亦为空间哈希格长）
  velocity: 0.05     # 传导速度 VEL（空间单位/ms）；delay=round(dist/VEL)
  k_in: 16           # 输入→池：每池最近 k 输入
  k_pool: 12         # 池→池：per-source 最近 k（D11）
  # exp-g 判定 / Diehl-Cook 回归开关（归因 Wave 1b，§3 M4）：True=现状
  # （池内 E→E 可塑性开启）；False=冻结池内可塑性（仅输入→池可学习，
  # 池间连接固定）→ 触发 exp-g 判定实验。G1 前冻结纪律：默认保持 True。
  k_pool_learn: true
  max_delay: 15      # 延迟上界 delay_max；时间轮 L = delay_max+1 = 16（max_delay<L）

# ---- LIF 神经元与时间（lif）---------------------------------------------------
lif:
  tau_mem: 20        # 膜时间常数 τ_m（ms）；decayV = exp(-1/tau_mem)
  theta0: 1.0        # 初始发放阈值 θ0（增益标定基准）
  refractory: 2      # 绝对不应期 REFR（ms）：refr=t+REFR，仅 t>refr 可再发放（R1）
  T: 200             # 单样本时长 T（ms）；window_s = T/1000 = 0.2 s（homeo 统计窗）
  dt: 1              # 时间步长（ms）；L0 内核当前仅支持 dt=1 步进

# ---- STDP（stdp）--------------------------------------------------------------
stdp:
  eta_ltp: 0.008     # post_ltp 加性系数 ETA_LTP：csr_w += ETA_LTP * trace[src]
  eta_ltd: 0.004     # pre_ltd 乘性系数 ETA_LTD：w *= (1 - ETA_LTD * trace[dst])
  tau_trace: 20      # 突触迹时间常数 τ_tr（ms）；decayT = exp(-1/tau_trace)
  w_min: 0.02        # 权重下界 w_lo（clip 区间 [0.02, 1.5]）
  w_max: 1.5         # 权重上界 w_hi（clip 区间 [0.02, 1.5]）

# ---- 稳态调节（homeo）----------------------------------------------------------
homeo:
  target_rate_hz: 8  # 逐神经元目标发放率（Hz）
  eta_homeo: 0.05    # 阈值自适应步长（theta += eta*(rate_ema - target)）
  ema_alpha: 0.1     # rate_ema = (1-alpha)*ema + alpha*(counts/window_s)

# ---- 协议（protocol；调度/校准用，G1 后由 scheduler 消费）-----------------------
protocol:
  adapt_epochs: 2        # 适应轮数
  calibrate_samples: 10  # 增益标定采样数
  calibrate_band: [3, 12]  # 标定发放率带（Hz）
  calibrate_max_iter: 2  # 标定最大迭代轮数
  extra_loops: 2         # 附加训练环数

# ---- L0 读出（readout_l0；G1 合成类读出，D5 后消费）-----------------------------
readout_l0:
  lr: 0.5                # 学习率
  iters: 300             # 训练迭代
  l2_lambda: 1.0e-4      # L2 正则系数

# ---- 特征（features；G1 读入特征面板）------------------------------------------
features:
  mode: v0               # 特征版本（v0：发放计数/直方图特征）
  n_bins: 5              # 时间分箱数
  feature_mask: pool     # 特征取自储备池（pool）而非输入

# ---- L1 读出（readout_l1；G2 MNIST 读出）---------------------------------------
# 注：D5/G2 里程碑前由 scheduler/readout 消费；数值为 §3 M5 记号的当前默认，
# 待 §4 readout_l1 表在 core 阶段落位后冻结（G1 前冻结纪律）。
readout_l1:
  mode: accumulate       # 累积发放计数读出
  n_out: 10              # 输出类别数（MNIST 10 类）
  lr: 0.05
  iters: 100
  l2_lambda: 1.0e-4

# ---- 输入编码（encoder；对应 core.encoder M2 默认）-------------------------------
encoder:
  mode: latency          # 首脉冲时延编码（FIX-B8）
  t0: 2                  # 首个发放时刻 = t0 + (1-I)*t_span（ms）
  t_span: 40.0           # 时延跨度（ms）
  intensity_thr: 0.12    # 仅 I > thr 严格发放
  poisson_on: false      # Poisson 编码默认关闭（调度器负责）
  mnist_out: 10          # MNIST 自适应池化输出边长（10x10=100 单元，D14）
  dvs_n_in: 512          # DVS 输入规模（G3 里程碑契约）
